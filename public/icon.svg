<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="100%" stop-color="#003B73" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2B8" />
      <stop offset="100%" stop-color="#00A896" />
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B6B" />
      <stop offset="100%" stop-color="#EE5253" />
    </linearGradient>
  </defs>

  <!-- Rounded Background Badge -->
  <rect x="0" y="0" width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Outer Glow / Accent Ring -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="none" stroke="#00D2B8" stroke-width="8" stroke-opacity="0.3" />

  <g transform="translate(256, 256)">
    <!-- Left Wing -->
    <path d="M-20,-40 C-80,-140 -200,-110 -190,-10 C-180,70 -90,90 -20,10 Z" fill="url(#wingGrad)" />
    <!-- Right Wing -->
    <path d="M20,-40 C80,-140 200,-110 190,-10 C180,70 90,90 20,10 Z" fill="url(#wingGrad)" />
    
    <!-- Secondary Soft Inner Feather/Wings -->
    <path d="M-15,-20 C-60,-90 -140,-70 -130,0 C-120,50 -60,60 -15,10 Z" fill="#E6FFFA" opacity="0.9" />
    <path d="M15,-20 C60,-90 140,-70 130,0 C120,50 60,60 15,10 Z" fill="#E6FFFA" opacity="0.9" />

    <!-- Center Warm Heart / Caring Emblem -->
    <path d="M0,-30 C-22,-55 -55,-35 -55,-5 C-55,25 0,65 0,75 C0,65 55,25 55,-5 C55,-35 22,-55 0,-30 Z" fill="url(#heartGrad)" />

    <!-- Little Sparkle / Star of Care at top -->
    <circle cx="0" cy="-105" r="14" fill="#FFD166" />
    <path d="M0,-125 L3,-110 L18,-107 L5,-96 L9,-81 L0,-90 L-9,-81 L-5,-96 L-18,-107 L-3,-110 Z" fill="#FFD166" />
  </g>
</svg>
